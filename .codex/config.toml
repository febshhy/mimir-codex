# Mimir project defaults. Codex loads project config only for trusted projects.
# Explicit user/CLI selections and managed policy may override these defaults.
model = "gpt-6.2-sol"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[features]
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[[hooks.PreToolUse]]
matcher = "^(Agent|spawn_agent|Bash|Shell|exec_command|apply_patch|Edit|Write|write_stdin)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/model-routing.py"'
statusMessage = "Checking Mimir role, model, and tool routing"
