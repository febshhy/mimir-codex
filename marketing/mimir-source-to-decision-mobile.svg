<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" role="img" aria-labelledby="title desc">
  <title id="title">From the well to the valley</title>
  <desc id="desc">A stone-lined channel carries water from a well to cultivated fields. The four stages are Source records, Data pipeline, Verified result, and Decision.</desc>
  <g transform="scale(.3333333333)">
  <defs>
    <linearGradient id="sky" x2="0" y2="100%" gradientUnits="objectBoundingBox">
      <stop stop-color="#304650"/>
      <stop offset="1" stop-color="#d8d4c3"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#8d9690"/>
      <stop offset="1" stop-color="#283d42"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#c0b7a5"/>
      <stop offset="1" stop-color="#5d6868"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#baccc3"/>
      <stop offset="1" stop-color="#4f777b"/>
    </linearGradient>
    <pattern id="joints" width="54" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0H54M16 0v20" fill="none" stroke="#243940" stroke-opacity=".25"/>
    </pattern>
    <linearGradient id="strip" x2="0" y2="100%">
      <stop stop-color="#2d3b41"/>
      <stop offset="1" stop-color="#1a272d"/>
    </linearGradient>
  </defs>

