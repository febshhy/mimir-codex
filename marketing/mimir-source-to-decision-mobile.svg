    <text x="64" y="232" fill="#cdd3ce" font-size="15">Trace the original events</text>
    <text x="24" y="278" fill="#d6b37e" font-family="Georgia, serif" font-size="21">02</text>
    <text x="64" y="278" fill="#f2ede0" font-size="21" font-weight="600">Data pipeline</text>
    <text x="64" y="302" fill="#cdd3ce" font-size="15">Capture and transform the data</text>
    <text x="24" y="348" fill="#d6b37e" font-family="Georgia, serif" font-size="21">03</text>
    <text x="64" y="348" fill="#f2ede0" font-size="21" font-weight="600">Verified result</text>
    <text x="64" y="372" fill="#cdd3ce" font-size="15">Check against known values</text>
    <text x="24" y="418" fill="#d6b37e" font-family="Georgia, serif" font-size="21">04</text>
    <text x="64" y="418" fill="#f2ede0" font-size="21" font-weight="600">Decision</text>
